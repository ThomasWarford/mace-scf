# Optimizer scan (job A): R2 stage-1 Huber loss, no multipole loss, lr 0.005 as in the multipole scan.
# See ../scan.sh. `end` is past the debug limit on purpose; the per-epoch validation lines are the result.
heads:
  default:
    info_keys:
      energy: REF_energy
      total_charge: REF_total_charge
      stress: REF_stress
    arrays_keys:
      forces: REF_forces
      charges: REF_formal_charges
      atomic_multipoles: REF_multipoles

train_schedule:
  0:
    name: stage1
    start: 0
    end: 200
    loss:
      energy_per_atom_huber: {weight: 1.0, huber_delta: 0.01}
      forces_huber: {weight: 10.0, huber_delta: 0.01}
      stress_huber: {weight: 10.0, huber_delta: 0.01}
    lr: 0.005
