# Vanilla ScaleShiftMACE on the MACE-MatPES (0b3) backbone: the no-electrostatics control.
# Key names are inert for .h5 input (parsing happened at preprocess time) but check_and_fix_heads still requires them.
heads:
  default:
    info_keys:
      energy: REF_energy
      total_charge: REF_total_charge
      stress: REF_stress
    arrays_keys:
      forces: REF_forces
      charges: REF_formal_charges
      atomic_multipoles: REF_multipoles

# 0b3's `universal` loss, decomposed into the conditional-Huber terms added in 39f51f4:
# --loss universal --energy_weight 1 --forces_weight 10 --stress_weight 10 maps onto these
# three at huber_delta 0.01. The dict form is required because they take that option.
# Stage 1 is 0b3's weights exactly. 0b3 has no stages, so stage 2 keeps this repo's
# energy-weighted rebalance, with stress held constant across stages as before.
#
# lr deliberately stays at the MACE from-scratch default rather than 0b3's 0.005: 32 ranks at
# --batch_size 16 give a global batch of 512, well above the 128-256 0b3 trained at.
train_schedule:
  0:
    name: stage1
    start: 0
    end: 49
    loss:
      energy_per_atom_huber: {weight: 1.0, huber_delta: 0.01}
      forces_huber: {weight: 10.0, huber_delta: 0.01}
      stress_huber: {weight: 10.0, huber_delta: 0.01}
    lr: 0.01
  1:
    name: stage2
    start: 50
    end: 89
    loss:
      energy_per_atom_huber: {weight: 100.0, huber_delta: 0.01}
      forces_huber: {weight: 20.0, huber_delta: 0.01}
      stress_huber: {weight: 10.0, huber_delta: 0.01}
    lr: 0.001
