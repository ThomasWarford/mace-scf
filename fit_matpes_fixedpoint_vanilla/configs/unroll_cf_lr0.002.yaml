# Stage 2 on the R2 backbone, from the R2 direct model (direct_docs_lr0.02.yaml with BACKBONE=r2
# CUEQ=1 BATCH=8, job 59508576; its stage 1 is repeated here unchanged and skipped: seed this
# run's checkpoint dir with that run's direct_epoch-49 checkpoint, renamed to this run's tag).
# Same as unroll_cf.yaml (constant Fermi level; unroll_cq's mu search ran away on the 128 model)
# except the lr, sqrt-scaled from B=16 to B=8 like the direct stage: 0.0028 -> 0.002.
# Run with BACKBONE=r2 CUEQ=1 BATCH=8 (B=16 OOMs on R2). See ../train.sh.
heads:
  default:
    info_keys:
      energy: REF_energy
      total_charge: REF_total_charge
      stress: REF_stress
      fermi_level: REF_vasp_fermi_level_plus_alpha_bet
    arrays_keys:
      forces: REF_forces
      charges: REF_formal_charges
      atomic_multipoles: REF_multipoles
train_schedule:
  0:
    name: direct
    start: 0
    end: 49
    loss:
      atomic_multipoles: 100.0
      total_charge_per_atom: 1000.0
      energy_per_atom: 10.0
      forces: 100.0
    lr: 0.02
    fixed_point_training_options:
      mode: direct
  1:
    name: unroll
    start: 50
    end: 54
    reset_optimizer: True
    reset_ema: True
    loss:
      atomic_multipoles: 100.0
      total_charge_per_atom: 1000.0
      energy_per_atom: 1000.0
      forces: 100.0
    lr: 0.002
    fixed_point_training_options:
      mode: unroll_scf
      scf:
        num_scf_steps: 10
        mixing_parameter: 0.3
        constant_charge: false
        initial_density: from_data
        initial_fermi_level: from_data
        use_autograd_forces: true
