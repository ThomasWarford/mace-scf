# linearize_solve after the Huber constant-charge unroll: seeded from that run's best checkpoint
# (fp_vanilla_fermiab_unroll_cq_huber_lr0.002_20ep_r2_mono_cueq_b8_wrand_g32, unroll epoch 60),
# converted cueq -> e3nn (linearize_solve is refused under --enable_cueq) and renamed
# _direct_epoch-60 so --restart_latest skips stage 0 (end 60: stages must be contiguous; it never
# runs) and starts linsolve at epoch 61. Up to 20 epochs (61-80); run with EXTRA="--patience 5".
# Losses as the Huber unroll_cq stage; SCF and lr as linsolve_cq_lr0.001_20ep.yaml (100 steps,
# tol 1e-6, mixing 0.3, from the reference density and Fermi level; B=2, global batch 64, lr
# sqrt-scaled from the unroll's 0.002 at 256: 0.001).
# Run with BACKBONE=r2 UPDATE=monotone TAG=wrand, no CUEQ, no BATCH. See ../train.sh.
heads:
  default:
    info_keys:
      energy: REF_energy
      total_charge: REF_total_charge
      stress: REF_stress
      fermi_level: REF_vasp_fermi_level_plus_alpha_bet
    arrays_keys:
      forces: REF_forces
      charges: REF_formal_charges
      atomic_multipoles: REF_multipoles
train_schedule:
  0:
    name: direct
    start: 0
    end: 60
    loss:
      atomic_multipoles: 100.0
      total_charge_per_atom: 1000.0
      energy_per_atom_huber: {weight: 100.0, huber_delta: 0.01}
      forces_huber: {weight: 1000.0, huber_delta: 0.01}
    lr: 0.02
    fixed_point_training_options:
      mode: direct
  1:
    name: linsolve
    start: 61
    end: 80
    reset_optimizer: True
    reset_ema: True
    loss:
      atomic_multipoles: 100.0
      total_charge_per_atom: 1000.0
      energy_per_atom_huber: {weight: 10000.0, huber_delta: 0.01}
      forces_huber: {weight: 1000.0, huber_delta: 0.01}
      fermi_level_per_atom: 1.0
    lr: 0.001
    fixed_point_training_options:
      mode: linearize_solve
      scf:
        num_scf_steps: 100
        scf_tolerance: 1.0e-6
        mixing_parameter: 0.3
        constant_charge: true
        initial_density: from_data
        initial_fermi_level: from_data
        use_autograd_forces: true
