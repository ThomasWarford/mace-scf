# linearize_solve after the R2 monotone constant-charge unroll: seeded from that run's best
# checkpoint (fp_vanilla_fermiab_unroll_cq_lr0.002_20ep_r2_mono_cueq_b8_wrand_g32, unroll epoch 51),
# converted cueq -> e3nn (linearize_solve is refused under --enable_cueq) and renamed
# _direct_epoch-51 so --restart_latest skips stage 0 (end 51: stages must be contiguous; it never
# runs) and starts linsolve at epoch 52. Up to 20
# epochs (52-71); run with EXTRA="--patience 5". Losses as the unroll_cq stage (constant charge,
# fermi_level_per_atom 1.0); SCF as vanilla.yaml's linsolve stage (100 steps, tol 1e-6, mixing
# 0.3, from the reference density and Fermi level). B=2 (linsolve memory, see ../train.sh), so
# global batch 64 and lr sqrt-scaled from the unroll's 0.002 at 256: 0.001.
# Run with BACKBONE=r2 UPDATE=monotone TAG=wrand, no CUEQ, no BATCH. See ../train.sh.
heads:
  default:
    info_keys:
      energy: REF_energy
      total_charge: REF_total_charge
      stress: REF_stress
      fermi_level: REF_vasp_fermi_level_plus_alpha_bet
    arrays_keys:
      forces: REF_forces
      charges: REF_formal_charges
      atomic_multipoles: REF_multipoles
train_schedule:
  0:
    name: direct
    start: 0
    end: 51
    loss:
      atomic_multipoles: 100.0
      total_charge_per_atom: 1000.0
      energy_per_atom: 10.0
      forces: 100.0
    lr: 0.02
    fixed_point_training_options:
      mode: direct
  1:
    name: linsolve
    start: 52
    end: 71
    reset_optimizer: True
    reset_ema: True
    loss:
      atomic_multipoles: 100.0
      total_charge_per_atom: 1000.0
      energy_per_atom: 1000.0
      forces: 100.0
      fermi_level_per_atom: 1.0
    lr: 0.001
    fixed_point_training_options:
      mode: linearize_solve
      scf:
        num_scf_steps: 100
        scf_tolerance: 1.0e-6
        mixing_parameter: 0.3
        constant_charge: true
        initial_density: from_data
        initial_fermi_level: from_data
        use_autograd_forces: true
