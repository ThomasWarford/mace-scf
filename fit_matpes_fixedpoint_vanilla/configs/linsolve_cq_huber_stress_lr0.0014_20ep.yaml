# linearize_solve after the Huber + stress constant-charge unroll: seeded from that run's best
# checkpoint (fp_vanilla_fermiab_unroll_cq_huber_stress_lr0.002_20ep_r2_mono_cueq_b8_wrand_g32,
# unroll epoch 60), converted cueq -> e3nn and seeded as _direct_epoch-60 (seed_e3nn_checkpoint.py),
# so --restart_latest skips the placeholder stage 0 and starts linsolve at epoch 61 (up to 80).
# linsolve_cq_huber_lr0.001_20ep.yaml plus stress_huber at the force weight, at B=4: the chunked,
# graph-free Jacobian (mace_scf/utils/linearize_solve.py) fits the worst-case B=4 batch (49 GiB
# on 80 GB) where B=2 was the limit before; lr sqrt-scaled from 0.001 at global batch 64 to 128.
# Run with BACKBONE=r2 UPDATE=monotone TAG=wrand BATCH=4, no CUEQ, EXTRA="--patience 5". See ../train.sh.
heads:
  default:
    info_keys:
      energy: REF_energy
      total_charge: REF_total_charge
      stress: REF_stress
      fermi_level: REF_vasp_fermi_level_plus_alpha_bet
    arrays_keys:
      forces: REF_forces
      charges: REF_formal_charges
      atomic_multipoles: REF_multipoles
train_schedule:
  0:
    name: direct
    start: 0
    end: 60
    loss:
      atomic_multipoles: 100.0
      total_charge_per_atom: 1000.0
      energy_per_atom_huber: {weight: 100.0, huber_delta: 0.01}
      forces_huber: {weight: 1000.0, huber_delta: 0.01}
      stress_huber: {weight: 1000.0, huber_delta: 0.01}
    lr: 0.02
    fixed_point_training_options:
      mode: direct
  1:
    name: linsolve
    start: 61
    end: 80
    reset_optimizer: True
    reset_ema: True
    loss:
      atomic_multipoles: 100.0
      total_charge_per_atom: 1000.0
      energy_per_atom_huber: {weight: 10000.0, huber_delta: 0.01}
      forces_huber: {weight: 1000.0, huber_delta: 0.01}
      stress_huber: {weight: 1000.0, huber_delta: 0.01}
      fermi_level_per_atom: 1.0
    lr: 0.0014
    fixed_point_training_options:
      mode: linearize_solve
      scf:
        num_scf_steps: 100
        scf_tolerance: 1.0e-6
        mixing_parameter: 0.3
        constant_charge: true
        initial_density: from_data
        initial_fermi_level: from_data
        use_autograd_forces: true
