# Overfit test: direct only, open-ended, on one small shard used as both train and "valid" set
# (TRAIN_DIR=VALID_DIR), to see whether direct mode can fit the density and energies at all.
# Variant C: B without total_charge_per_atom (DDEC charges are neutral already). See ../train.sh.
heads:
  default:
    info_keys:
      energy: REF_energy
      total_charge: REF_total_charge
      stress: REF_stress
      fermi_level: REF_vasp_fermi_level_plus_alpha_bet
    arrays_keys:
      forces: REF_forces
      charges: REF_formal_charges
      atomic_multipoles: REF_multipoles
train_schedule:
  0:
    name: direct
    start: 0
    end: 999
    loss:
      energy_per_atom_huber: {weight: 1.0, huber_delta: 0.01}
      forces_huber: {weight: 10.0, huber_delta: 0.01}
      atomic_multipoles_huber: {weight: 5.0, huber_delta: 0.01}
    lr: 0.01
    fixed_point_training_options:
      mode: direct
