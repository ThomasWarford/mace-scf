# Full-data LSC fit, case `hub_5`: R3's (../fit_matpes_polarm_pbe_rf_sf/config.yaml) stage 1
# exactly, plus a Huber multipole term, weight 5, delta 0.01. Stage 1 is open-ended (end 99) so a run can be
# extended; the debug-queue chain (../chain.sh) stops it at its target epoch. See ../train.sh.
heads:
  default:
    info_keys:
      energy: REF_energy
      total_charge: REF_total_charge
      stress: REF_stress
    arrays_keys:
      forces: REF_forces
      charges: REF_formal_charges
      atomic_multipoles: REF_multipoles
train_schedule:
  0:
    name: stage1
    start: 0
    end: 99
    loss:
      energy_per_atom_huber: {weight: 1.0, huber_delta: 0.01}
      forces_huber: {weight: 10.0, huber_delta: 0.01}
      stress_huber: {weight: 10.0, huber_delta: 0.01}
      atomic_multipoles_huber: {weight: 5.0, huber_delta: 0.01}
    lr: 0.01
